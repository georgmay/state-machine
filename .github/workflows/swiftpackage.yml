name: Swift

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Select min supported Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.app
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
